name: nica_app
description: Ecosistema Turístico de Nicaragua — aplicación Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0
  supabase_flutter: ^2.6.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  http: ^1.2.2
  url_launcher: ^6.3.0 # Abrir WhatsApp, llamadas, correos y la fuente de cada dato
  video_player: ^2.9.0 # Revelación del logotipo al abrir la app (video del dueño, sin sonido)
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/ # Textos legales (copiados desde content/legal por scripts/sync_legal.py)
    - assets/mapa/ # Mapa ilustrado de los 17 territorios (copiado por scripts/sync_mapa.py)
    - assets/fotos/ # Fotos reales con licencia libre y su crédito (copiadas por scripts/sync_fotos.py)
    - assets/intro/revelacion.mp4 # Revelación del logotipo: 3 segundos, 720p, sin sonido (recortada del video del dueño)
  # generate: true  → activar al añadir l10n.yaml y los ARB de los 10 idiomas (Fase 9)

name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  design-tokens:
    name: Sistema de diseño alineado (web + Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_tokens.py
      - name: Textos legales iguales en web y Android # Sobre nosotros, privacidad, cookies, términos…
        run: python3 scripts/sync_legal.py --check

  ai-core:
    name: Lógica sin dependencias (asistente, Ops Center, funciones)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test packages/ai-core/test/*.test.ts
      - name: Ops Center alineado con la base de datos
        run: node --test scripts/ops-resources.test.ts
      - name: Función de Supabase preparar-sesion (pruebas sin red) # Verificación del token, perfil, rol y cuentas suspendidas
        run: node --test supabase/functions/tests/*.test.ts
      - uses: denoland/setup-deno@v2 # Instala Deno, el mismo motor que usan las funciones de Supabase
        with: { deno-version: v2.x } # Última versión estable de Deno 2
      - name: Tipos de las funciones de Supabase con Deno # Revisa index.ts tal como se desplegará
        run: deno check supabase/functions/*/index.ts
      - name: Cabeceras de seguridad de la web # CSP, HSTS y demás, sin eval en producción
        run: node --test apps/web/security-headers.test.mjs

  node:
    name: Web + API (tipos, pruebas, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Sin pnpm-lock.yaml aún: se genera aquí. Cuando exista en el repo, cambiar a --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - name: Tipos
        run: pnpm -r --if-present run typecheck
      - name: Pruebas
        run: pnpm -r --if-present run test
      - name: Build
        run: pnpm -r --if-present run build
      - name: Dependencias sin vulnerabilidades críticas # Falla solo con avisos críticos en dependencias de producción
        run: |
          pnpm audit --prod --json > audit.json || true # Reporte completo (no corta aquí)
          python3 - <<'PY'
          import json, sys
          data = json.load(open('audit.json'))
          bad = [a for a in data.get('advisories', {}).values() if a.get('severity') == 'critical']
          for a in bad:
              paths = ', '.join(sorted({f['paths'][0] for f in a.get('findings', []) if f.get('paths')})[:3])
              print(f"::error title=Dependencia crítica: {a['module_name']}::{a['title']}. Afectadas: {a['vulnerable_versions']}. Corregida en: {a['patched_versions']}. Ruta: {paths}. {a.get('url','')}")
          high = [a for a in data.get('advisories', {}).values() if a.get('severity') == 'high']
          for a in high[:5]:
              print(f"::warning title=Dependencia con riesgo alto: {a['module_name']}::{a['title']}. Corregida en: {a['patched_versions']}.")
          sys.exit(1 if bad else 0)
          PY
      - name: Guardar pnpm-lock.yaml generado
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pnpm-lock, path: pnpm-lock.yaml, if-no-files-found: ignore }

  database:
    name: Migraciones + pruebas RLS
    runs-on: ubuntu-24.04
    env:
      FIREBASE_PROJECT_ID: nica-ci
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Levantar Supabase local y aplicar migraciones
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor 2>&1 | tee start.log || {
            grep -iE "error|fail|ERROR:" start.log | tail -n 15 | while IFS= read -r line; do echo "::error title=supabase start::${line}"; done
            exit 1
          }
      - name: Pruebas de humo RLS
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_smoke.sql > rls.out 2>&1 || true
          grep -E "FAIL|ERROR" rls.out | head -n 20 | while IFS= read -r line; do echo "::error title=RLS::${line}"; done
          tail -n 5 rls.out
          ! grep -qE "FAIL|ERROR" rls.out

  mobile:
    name: Android (análisis y pruebas)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Análisis
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || status=$?
          # Publica cada error/aviso como anotación visible en GitHub
          grep -E "^(ERROR|WARNING)\|" analyze.txt | head -n 40 | while IFS='|' read -r sev type code file line col len msg; do
            rel="apps/mobile/${file#*apps/mobile/}"
            echo "::error file=${rel},line=${line},col=${col}::${code}: ${msg}"
          done
          exit ${status:-0}
      - name: Pruebas # Cada prueba fallida se publica como anotación con su error
        run: |
          flutter test --machine > test.jsonl || status=$? # Resultado en formato de máquina (una línea JSON por evento)
          python3 - <<'PY'
          import json
          names, shown, prints = {}, 0, {}
          for raw in open('test.jsonl', encoding='utf-8', errors='replace'):
              raw = raw.strip()
              if not raw.startswith('{'):
                  continue
              try:
                  e = json.loads(raw)
              except ValueError:
                  continue
              kind = e.get('type')
              if kind == 'testStart':
                  names[e['test']['id']] = e['test'].get('name', '')
              elif kind == 'print':
                  prints.setdefault(e.get('testID'), []).append(str(e.get('message', '')))
              elif kind == 'error' and shown < 8:
                  shown += 1
                  logs = ' '.join(prints.get(e.get('testID'), []))
                  text = (str(e.get('error', '')) + ' ' + logs[:1400] + ' ' + str(e.get('stackTrace', ''))[:300]).replace('\n', ' ').replace('%', '%25')
                  print(f"::error title=Prueba Android: {names.get(e.get('testID'), '?')}::{text[:3000]}")
          PY
          exit ${status:-0}

  docker:
    name: Imágenes Docker (web y API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen de la API # Comprueba que la receta funciona (no se publica)
        run: docker build -f apps/api/Dockerfile -t nica-api:ci .
      - name: Construir imagen de la web # Sin configuración: la web arranca con avisos de "no disponible todavía"
        run: docker build -f apps/web/Dockerfile -t nica-web:ci .
      - name: La web arranca sin privilegios y responde # Prueba real del contenedor
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache -p 3000:3000 nica-web:ci # Arranca con disco de solo lectura
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/es && break; sleep 2; done # Espera hasta 60 s
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:3000/es/privacidad # Pide la página de privacidad
          grep -qi "content-security-policy" headers.txt # Debe traer la política de seguridad
          grep -qi "strict-transport-security" headers.txt # Y HSTS
          test "$(docker exec web id -u)" != "0" # Y no correr como administrador
          docker logs web | tail -20 # Deja el registro visible
      - uses: actions/setup-node@v4 # Node para la revisión de accesibilidad
        with: { node-version: 22 }
      - name: Accesibilidad WCAG 2.2 AA (axe, temas claro y oscuro) # Falla con problemas graves o críticos
        working-directory: scripts/a11y
        run: |
          npm install --no-audit --no-fund # Instala axe y Playwright solo para esta revisión
          npx playwright install --with-deps chromium # Navegador para la revisión
          BASE_URL=http://127.0.0.1:3000 node check.mjs # Revisa las páginas principales

# Despliegue a staging y producción: workflow separado (deploy.yml) con environment
# "production" protegido por aprobación manual. Se añade en Fase 2 cuando existan
# el servidor de Hostinger y los secrets.

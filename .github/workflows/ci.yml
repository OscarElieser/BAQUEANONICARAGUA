name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  design-tokens:
    name: Sistema de diseño alineado (web + Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_tokens.py
      - name: Flujos de GitHub Actions bien escritos (actionlint) # Detecta errores en ci.yml, codeql.yml y deploy.yml antes de usarlos
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 # Descarga una versión fija
          ./actionlint -oneline > actionlint.txt || status=$? # Revisa todos los flujos (una línea por error)
          sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/' actionlint.txt # Publica cada error como anotación
          exit "${status:-0}" # Falla si hubo errores
      - name: Script de despliegue sin errores (shellcheck) # deploy/servidor/desplegar.sh
        run: shellcheck deploy/servidor/desplegar.sh
      - name: Textos legales iguales en web y Android # Sobre nosotros, privacidad, cookies, términos…
        run: python3 scripts/sync_legal.py --check
      - name: Interfaz en 10 idiomas (mismas claves y variables, web y Android alineados) # Textos de content/i18n
        run: python3 scripts/sync_i18n.py --check
      - name: Mapa de los 17 territorios igual en web y Android # content/territorios/mapa.json
        run: python3 scripts/sync_mapa.py --check
      - name: Fotos reales con autor y licencia libre, iguales en web y Android # content/fotos/fotos.json
        run: python3 scripts/sync_fotos.py --check

  ai-core:
    name: Lógica sin dependencias (asistente, Ops Center, funciones)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node --test packages/ai-core/test/*.test.ts
      - name: Ops Center alineado con la base de datos
        run: node --test scripts/ops-resources.test.ts
      - name: Función de Supabase preparar-sesion (pruebas sin red) # Verificación del token, perfil, rol y cuentas suspendidas
        run: node --test supabase/functions/tests/*.test.ts
      - uses: denoland/setup-deno@v2 # Instala Deno, el mismo motor que usan las funciones de Supabase
        with: { deno-version: v2.x } # Última versión estable de Deno 2
      - name: Tipos de las funciones de Supabase con Deno # Revisa index.ts tal como se desplegará
        run: deno check supabase/functions/*/index.ts
      - name: Cabeceras de seguridad de la web # CSP, HSTS y demás, sin eval en producción
        run: node --test apps/web/security-headers.test.mjs

  node:
    name: Web + API (tipos, pruebas, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # Sin pnpm-lock.yaml aún: se genera aquí. Cuando exista en el repo, cambiar a --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - name: Tipos
        run: pnpm -r --if-present run typecheck
      - name: Pruebas
        run: pnpm -r --if-present run test
      - name: Build
        run: pnpm -r --if-present run build
      - name: Dependencias sin vulnerabilidades críticas # Falla solo con avisos críticos en dependencias de producción
        run: |
          pnpm audit --prod --json > audit.json || true # Reporte completo (no corta aquí)
          python3 - <<'PY'
          import json, sys
          data = json.load(open('audit.json'))
          bad = [a for a in data.get('advisories', {}).values() if a.get('severity') == 'critical']
          for a in bad:
              paths = ', '.join(sorted({f['paths'][0] for f in a.get('findings', []) if f.get('paths')})[:3])
              print(f"::error title=Dependencia crítica: {a['module_name']}::{a['title']}. Afectadas: {a['vulnerable_versions']}. Corregida en: {a['patched_versions']}. Ruta: {paths}. {a.get('url','')}")
          high = [a for a in data.get('advisories', {}).values() if a.get('severity') == 'high']
          for a in high[:5]:
              print(f"::warning title=Dependencia con riesgo alto: {a['module_name']}::{a['title']}. Corregida en: {a['patched_versions']}.")
          sys.exit(1 if bad else 0)
          PY
      - name: Guardar pnpm-lock.yaml generado
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: pnpm-lock, path: pnpm-lock.yaml, if-no-files-found: ignore }

  database:
    name: Migraciones + pruebas RLS
    runs-on: ubuntu-24.04
    env:
      FIREBASE_PROJECT_ID: nica-ci
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - name: Levantar Supabase local y aplicar migraciones
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor 2>&1 | tee start.log || {
            grep -iE "error|fail|ERROR:" start.log | tail -n 15 | while IFS= read -r line; do echo "::error title=supabase start::${line}"; done
            exit 1
          }
      - name: Pruebas de humo RLS
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_smoke.sql > rls.out 2>&1 || true
          grep -E "FAIL|ERROR" rls.out | head -n 20 | while IFS= read -r line; do echo "::error title=RLS::${line}"; done
          tail -n 5 rls.out
          ! grep -qE "FAIL|ERROR" rls.out

  mobile:
    name: Android (análisis y pruebas)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Análisis
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || status=$?
          # Publica cada error/aviso como anotación visible en GitHub
          grep -E "^(ERROR|WARNING)\|" analyze.txt | head -n 40 | while IFS='|' read -r _ _ code file line col _ msg; do
            rel="apps/mobile/${file#*apps/mobile/}"
            echo "::error file=${rel},line=${line},col=${col}::${code}: ${msg}"
          done
          exit "${status:-0}"
      - name: Pruebas # Cada prueba fallida se publica como anotación con su error
        run: |
          flutter test --machine > test.jsonl || status=$? # Resultado en formato de máquina (una línea JSON por evento)
          python3 - <<'PY'
          import json
          names, shown, prints = {}, 0, {}
          for raw in open('test.jsonl', encoding='utf-8', errors='replace'):
              raw = raw.strip()
              if not raw.startswith('{'):
                  continue
              try:
                  e = json.loads(raw)
              except ValueError:
                  continue
              kind = e.get('type')
              if kind == 'testStart':
                  names[e['test']['id']] = e['test'].get('name', '')
              elif kind == 'print':
                  prints.setdefault(e.get('testID'), []).append(str(e.get('message', '')))
              elif kind == 'error' and shown < 8:
                  shown += 1
                  logs = ' '.join(prints.get(e.get('testID'), []))
                  text = (str(e.get('error', '')) + ' ' + logs[:1400] + ' ' + str(e.get('stackTrace', ''))[:300]).replace('\n', ' ').replace('%', '%25')
                  print(f"::error title=Prueba Android: {names.get(e.get('testID'), '?')}::{text[:3000]}")
          PY
          exit "${status:-0}"
      - uses: actions/setup-java@v6 # Java 17, el que pide el plugin de Android
        with: { distribution: temurin, java-version: '17' }
      - name: Compilar la app (APK de prueba) # Comprueba que Gradle, el manifiesto, los plugins y la firma compilan de verdad
        run: |
          set -o pipefail # El resultado es el de flutter, no el de tee
          [ -f android/app/google-services.json ] || cp android/app/google-services.json.example android/app/google-services.json # Sin el archivo real se usa el de ejemplo (mismo paquete, solo datos públicos)
          flutter build apk --debug 2>&1 | tee build.txt || status=$? # Compilación de depuración: no necesita la llave de publicación
          python3 - <<'PY'
          # Junta lo importante del registro en pocas anotaciones legibles (GitHub limita cuántas se muestran)
          lines = open('build.txt', encoding='utf-8', errors='replace').read().splitlines() # Registro de la compilación
          blocks = [] # Bloques de error
          for i, l in enumerate(lines): # Recorre el registro
              if 'What went wrong' in l: # Bloque de error de Gradle
                  blocks.append('\n'.join(lines[i:i + 14])) # El motivo viene en las líneas siguientes
          kotlin = [l for l in lines if l.startswith('e: ') or 'incompatible version of Kotlin' in l or 'minSdk' in l or 'Warning: Flutter support' in l or 'Error:' in l][:12] # Errores de Kotlin, minSdk y avisos de versiones
          if kotlin: # Hay líneas sueltas importantes
              blocks.append('\n'.join(kotlin)) # Van juntas en un bloque
          for b in blocks[:6]: # Hasta seis anotaciones
              print('::error title=Compilación Android::' + b[:3500].replace('%', '%25').replace('\r', '').replace('\n', '%0A')) # Multilínea codificada
          PY
          exit "${status:-0}"

  docker:
    name: Imágenes Docker (web y API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen de la API # Comprueba que la receta funciona (no se publica)
        run: docker build -f apps/api/Dockerfile -t nica-api:ci .
      - name: Construir imagen de la web # Sin configuración: la web arranca con avisos de "no disponible todavía"
        run: docker build -f apps/web/Dockerfile -t nica-web:ci .
      - name: La web arranca sin privilegios y responde # Prueba real del contenedor
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache -p 3000:3000 nica-web:ci # Arranca con disco de solo lectura
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/es && break; sleep 2; done # Espera hasta 60 s
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:3000/es/privacidad # Pide la página de privacidad
          grep -qi "content-security-policy" headers.txt # Debe traer la política de seguridad
          grep -qi "strict-transport-security" headers.txt # Y HSTS
          test "$(docker exec web id -u)" != "0" # Y no correr como administrador
          docker logs web | tail -20 # Deja el registro visible
      - name: Buscadores - sitemap, robots y canónicas por idioma # Lo que Google necesita para indexar los 10 idiomas
        run: |
          curl -fsS http://127.0.0.1:3000/robots.txt | tee robots.txt # robots.txt
          grep -q "Sitemap: .*/sitemap.xml" robots.txt # Anuncia el sitemap
          curl -fsS http://127.0.0.1:3000/sitemap.xml -o sitemap.xml # sitemap.xml
          grep -qi 'hreflang="ja"' sitemap.xml # Incluye las versiones por idioma
          test "$(grep -c '<url>' sitemap.xml)" -ge 120 # Al menos las 12 páginas fijas en los 10 idiomas
          curl -fsS http://127.0.0.1:3000/en/cultura -o cultura.html # Una página en inglés
          grep -qi 'rel="canonical" href="[^"]*/en/cultura"' cultura.html # Su canónica es ella misma, no la portada
          grep -qi 'hreflang="x-default"' cultura.html # Declara la versión por defecto
          curl -fsS "http://127.0.0.1:3000/es/mapa?q=volcan" -o busqueda.html # Una búsqueda
          grep -q 'name="robots" content="noindex, follow"' busqueda.html # Las búsquedas no se indexan, pero sus enlaces sí se siguen
      - name: Vista previa al compartir, icono y página 404 # Imágenes Open Graph del sitio y de un territorio, icono y "te perdiste en la neblina"
        run: |
          curl -fsS -o og.png -w '%{content_type}\n' http://127.0.0.1:3000/es/opengraph-image | grep -q image/png # Imagen del sitio
          curl -fsS -o og-ter.png -w '%{content_type}\n' http://127.0.0.1:3000/es/territorios/granada/opengraph-image | grep -q image/png # Imagen de un territorio (sale del mapa, sin base de datos)
          test "$(stat -c %s og-ter.png)" -gt 5000 # No es una imagen vacía
          curl -fsS -o /dev/null http://127.0.0.1:3000/icono.svg # Icono del sitio
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q icono-512.png # El manifiesto declara los iconos
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"purpose": "maskable"' # Y el icono enmascarable para Android
          curl -fsS -D sw.txt -o sw.js http://127.0.0.1:3000/sw.js # El trabajador del modo sin conexión
          grep -qi "service-worker-allowed: /" sw.txt # Puede atender todo el sitio
          grep -q "PRIVADAS" sw.js # Y excluye las zonas privadas
          curl -fsS http://127.0.0.1:3000/es/sin-conexion | grep -q 'noindex' # La página sin conexión existe y no se indexa
          code=$(curl -s -o 404.html -w '%{http_code}' http://127.0.0.1:3000/es/territorios/no-existe) # Una ficha que no existe
          test "$code" = 404 # Responde 404 de verdad
      - uses: actions/setup-node@v7 # Node para la revisión de accesibilidad
        with: { node-version: 22 }
      - name: Accesibilidad WCAG 2.2 AA (axe, temas claro y oscuro) # Falla con problemas graves o críticos
        working-directory: scripts/a11y
        run: |
          npm install --no-audit --no-fund # Instala axe y Playwright solo para esta revisión
          npx playwright install --with-deps chromium # Navegador para la revisión
          BASE_URL=http://127.0.0.1:3000 node check.mjs # Revisa las páginas principales

# Despliegue a staging y producción: workflow separado (deploy.yml), manual y con aprobación en producción. Ver docs/DESPLIEGUE.md.

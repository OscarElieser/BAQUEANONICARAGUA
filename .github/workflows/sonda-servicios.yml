# Sonda de solo lectura de los servicios externos (Firebase y la función de Supabase).
# No crea cuentas ni escribe nada: solo pregunta qué está activado y lo deja en el resumen del trabajo.
name: Sonda de servicios

on:
  workflow_dispatch: # A mano
  push:
    branches: [desarrollo] # Cuando cambia la sonda
    paths: ['scripts/sonda/**', '.github/workflows/sonda-servicios.yml']

permissions:
  contents: write # Para dejar el resultado en refs/datos/sonda (no es rama)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Igual que en CI

jobs:
  sondear:
    name: Comprobar Firebase y Supabase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # Descarga la sonda
      - name: Preguntar a los servicios # Usa solo claves públicas que ya están en la web
        run: mkdir -p salida && python3 scripts/sonda/sondear.py | tee salida/sonda.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar en refs/datos/sonda # Commit aparte que se reemplaza en cada ejecución
        run: |
          cd salida # Resultado
          git init -q && git checkout -q -b datos # Repositorio temporal
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" # Autor automático
          git add . && git commit -q -m "Sonda de servicios en $GITHUB_SHA" # Guarda
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/datos/sonda # Reemplaza el anterior

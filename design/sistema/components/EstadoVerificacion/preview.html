<!-- @dsCard group="Confianza" height=300 subtitle="Bloque de verificación de una ficha" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-text); }
  .wrap { padding: var(--space-6); max-width: 420px; }
  section { background: var(--ground-raised); border-radius: var(--radius-m); padding: var(--space-4) var(--space-4) 6px; }
  h3 { margin: 0 0 var(--space-2); font: 700 16px/22px var(--font-text); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: var(--space-3); padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .ok { color: var(--status-verified); }
  .pend { color: var(--oro-text); }
  .none { color: var(--ink-muted); }
  .alert { color: var(--status-alert); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <section aria-labelledby="qc">
    <h3 id="qc">Qué está comprobado</h3>
    <ul>
      <li><span>Ubicación</span><span class="pend">Aproximada</span></li>
      <li><span>Contacto</span><span class="ok">Comprobado el [fecha]</span></li>
      <li><span>Horarios</span><span class="none">Sin confirmar</span></li>
      <li><span>Tarifas</span><span class="none">Consulta al prestador</span></li>
      <li><span>Acceso</span><span class="alert">Restringido en temporada de lluvia</span></li>
      <li><span>Fuente</span><a href="#">Ver fuente</a></li>
    </ul>
  </section>
</div>
<script></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--ground); font-family: var(--font-text); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-6); }
  .btn { height: var(--control-height); padding: 0 26px; border-radius: var(--radius-pill); font: 700 15px/20px var(--font-text); cursor: pointer; }
  .primary { background: var(--oro); color: var(--on-oro); border: 0; }
  .secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--control-border); }
  .icon { width: var(--touch-min); height: var(--touch-min); border-radius: var(--radius-pill); border: 0; background: var(--ground-raised); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
<div class="row">
  <button class="btn primary">Explorar el mapa</button>
  <button class="btn secondary">Registrar mi negocio</button>
  <button class="icon" aria-label="Guardar en favoritos">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </button>
</div>
<script></script>
</body>
</html>

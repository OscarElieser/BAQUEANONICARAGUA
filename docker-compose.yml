# Entorno local con Docker: web y API. La base de datos local se levanta aparte con "supabase start"
# (la CLI de Supabase usa Docker por dentro y deja la base en http://127.0.0.1:54321).
# Uso: cp .env.example .env  ->  completar valores  ->  docker compose up --build

services:
  api:
    # API NestJS
    build:
      context: . # Se construye desde la raíz del monorepo
      dockerfile: apps/api/Dockerfile # Receta de la imagen
    env_file: .env # Variables del servidor (incluye secretos: nunca se suben al repositorio)
    environment:
      API_PORT: 4000 # Puerto interno
      CORS_ORIGINS: http://localhost:3000 # Solo la web local puede llamarla
      API_DOCS: "true" # Documentación interactiva activada solo en local
    ports:
      - "4000:4000" # Publica la API en http://localhost:4000
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite llegar al Supabase local que corre en la máquina
    read_only: true # Sistema de archivos de solo lectura
    tmpfs:
      - /tmp # Carpeta temporal en memoria
    security_opt:
      - no-new-privileges:true # El proceso no puede ganar privilegios
    restart: unless-stopped # Se reinicia si falla

  web:
    # Web Next.js
    build:
      context: . # Se construye desde la raíz del monorepo
      dockerfile: apps/web/Dockerfile # Receta de la imagen
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-} # Supabase (público)
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-} # Clave pública de Supabase
        NEXT_PUBLIC_API_URL: http://localhost:4000 # API local
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-} # Estilo del mapa
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-} # Firebase (público)
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-} # Firebase (público)
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-} # Firebase (público)
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-} # Firebase (público)
        CSP_EXTRA_CONNECT: ${CSP_EXTRA_CONNECT:-} # Proveedores extra permitidos
    ports:
      - "3000:3000" # Publica la web en http://localhost:3000
    depends_on:
      - api # Arranca después de la API
    read_only: true # Sistema de archivos de solo lectura
    tmpfs:
      - /tmp # Carpeta temporal en memoria
      - /app/apps/web/.next/cache # Caché de imágenes de Next.js en memoria
    security_opt:
      - no-new-privileges:true # El proceso no puede ganar privilegios
    restart: unless-stopped # Se reinicia si falla

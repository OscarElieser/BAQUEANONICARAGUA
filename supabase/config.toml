project_id = "nica-ecosistema"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[api]
schemas = ["public"]          # app y audit no se exponen por la Data API
extra_search_path = ["public", "extensions"]

[auth]
enabled = true

# Identidad de usuarios finales: Firebase (ADR-002).
[auth.third_party.firebase]
enabled = true
project_id = "env(FIREBASE_PROJECT_ID)"

# Función que prepara la sesión tras iniciar en Firebase (reemplaza las funciones de Firebase).
# verify_jwt = false porque el token que llega es de Firebase y la función lo verifica ella misma
# con las claves públicas de Google (firma, emisor, proyecto y vencimiento).
[functions.preparar-sesion]
verify_jwt = false # La verificación la hace la función, no la puerta de Supabase

# BAQÜI, el asistente (Gemini). El token de Firebase lo valida la base de datos (baqui_start), no la puerta de entrada.
[functions.baqui]
verify_jwt = false

[functions.enviar-avisos]
verify_jwt = false # La despierta pg_cron sin sesión; solo procesa avisos que ya están en la base
